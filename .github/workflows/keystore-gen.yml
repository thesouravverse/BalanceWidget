name: Keystore Generator (v2 - simple passwords)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore + emit secrets
        run: |
          set -e
          # Single 32-char alphanumeric password, no S/s/0/O/1/l ambiguity.
          # Same password for store AND key (PKCS12 default; avoids the BadPadding bug).
          PW=$(LC_ALL=C tr -dc 'A-HJ-NP-Za-hjkmnp-z2-9' </dev/urandom | head -c 32)
          ALIAS="balancewidget-upload"

          keytool -genkeypair \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore release.jks \
            -storetype PKCS12 \
            -storepass "$PW" \
            -keypass "$PW" \
            -dname "CN=Sourav, OU=Indie, O=BalanceWidget, L=Bengaluru, ST=KA, C=IN"

          # Verify both passwords actually work end-to-end
          keytool -list -v -keystore release.jks -storepass "$PW" -alias "$ALIAS" > /dev/null
          echo "Keystore verified OK."

          B64=$(base64 -w0 release.jks)

          echo "=================================================="
          echo "  COPY THESE 4 VALUES INTO GITHUB SECRETS"
          echo "=================================================="
          echo ""
          echo "KEYSTORE_PASSWORD = $PW"
          echo "KEY_PASSWORD      = $PW"
          echo "KEY_ALIAS         = $ALIAS"
          echo ""
          echo "KEYSTORE_B64 (single line, paste exactly):"
          echo "--------------------------------------------------"
          echo "$B64"
          echo "--------------------------------------------------"

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-bundle-v2
          path: release.jks
          retention-days: 3
