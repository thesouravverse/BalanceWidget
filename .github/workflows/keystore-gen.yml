name: Generate Release Keystore (one-off)

# Manual trigger only. Run this ONCE to generate your app signing key in CI.
#
# How to use:
#   1. Actions tab → "Generate Release Keystore (one-off)" → Run workflow.
#   2. Fill in CN / O / L / C inputs.
#   3. When it finishes, download the "keystore-bundle" artifact.
#   4. Inside the zip you get two files:
#        - release.jks          (the keystore — back it up in Google Drive + USB)
#        - SECRETS.txt          (the 4 values to paste into GitHub Secrets)
#   5. In Settings → Secrets and variables → Actions, add each secret name
#      with the matching value from SECRETS.txt:
#        KEYSTORE_B64
#        KEYSTORE_PASSWORD
#        KEY_ALIAS
#        KEY_PASSWORD
#   6. After secrets are saved, DELETE this workflow file from main and
#      DELETE the artifact from the workflow run.
#
# Losing release.jks = can never update the app on Play Store. Back it up.

on:
  workflow_dispatch:
    inputs:
      common_name:
        description: "Your full name (CN)"
        required: true
        default: "Sourav"
      organization:
        description: "Org / company name (O)"
        required: true
        default: "Thesouravverse"
      locality:
        description: "City (L)"
        required: true
        default: "Bengaluru"
      country:
        description: "Country code (C)"
        required: true
        default: "IN"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore + secrets bundle
        shell: bash
        run: |
          set -e
          mkdir -p bundle

          KEYSTORE_PASSWORD=$(openssl rand -base64 32 | tr -d '\n=+/' | cut -c1-28)
          KEY_PASSWORD=$(openssl rand -base64 32 | tr -d '\n=+/' | cut -c1-28)
          KEY_ALIAS="balancewidget-upload"

          keytool -genkeypair \
            -v \
            -keystore bundle/release.jks \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=${{ inputs.common_name }}, O=${{ inputs.organization }}, L=${{ inputs.locality }}, C=${{ inputs.country }}"

          base64 -w 0 bundle/release.jks > bundle/keystore_b64.txt

          {
            echo "============================================================"
            echo " BALANCEWIDGET - RELEASE SIGNING SECRETS"
            echo "============================================================"
            echo ""
            echo "Copy each of the 4 values below into GitHub:"
            echo "  Repo > Settings > Secrets and variables > Actions"
            echo "  > New repository secret."
            echo ""
            echo "Names must match EXACTLY (case-sensitive)."
            echo ""
            echo "------------------------------------------------------------"
            echo "Secret 1 of 4 - name: KEYSTORE_PASSWORD"
            echo "------------------------------------------------------------"
            echo "$KEYSTORE_PASSWORD"
            echo ""
            echo "------------------------------------------------------------"
            echo "Secret 2 of 4 - name: KEY_PASSWORD"
            echo "------------------------------------------------------------"
            echo "$KEY_PASSWORD"
            echo ""
            echo "------------------------------------------------------------"
            echo "Secret 3 of 4 - name: KEY_ALIAS"
            echo "------------------------------------------------------------"
            echo "$KEY_ALIAS"
            echo ""
            echo "------------------------------------------------------------"
            echo "Secret 4 of 4 - name: KEYSTORE_B64"
            echo "------------------------------------------------------------"
            echo "(one long line, contents of keystore_b64.txt)"
            cat bundle/keystore_b64.txt
            echo ""
            echo ""
            echo "============================================================"
            echo " BACKUP release.jks somewhere safe (Drive + USB)."
            echo " After adding the secrets, DELETE this artifact"
            echo " and DELETE .github/workflows/keystore-gen.yml from main."
            echo "============================================================"
          } > bundle/SECRETS.txt

      - name: Upload keystore bundle
        uses: actions/upload-artifact@v4
        with:
          name: keystore-bundle
          path: bundle/
          retention-days: 3
